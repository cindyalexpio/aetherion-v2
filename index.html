<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aetherion Research Archive</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aetherion">
<meta name="theme-color" content="#0a0e1a">
<style>
:root{--bg:#0a0e1a;--panel:#121828;--panel-2:#0d1220;--border:#262f49;--border-soft:#1a2136;--text:#e9e5d8;--text-soft:#c9c6bc;--muted:#8b90a3;--dim:#5d6377;--gold:#d4af37;--gold-brite:#e6c15c;--gold-deep:#9a7b2e;--serif:Georgia,"Palatino Linotype","Times New Roman",serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background-color:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background-image:radial-gradient(1px 1px at 22% 28%,rgba(212,175,55,.28) 0,transparent 100%),radial-gradient(1px 1px at 68% 18%,rgba(212,175,55,.22) 0,transparent 100%),radial-gradient(1.5px 1.5px at 42% 72%,rgba(124,108,240,.32) 0,transparent 100%),radial-gradient(1px 1px at 84% 62%,rgba(212,175,55,.18) 0,transparent 100%),radial-gradient(ellipse at 50% 0%,rgba(76,95,213,.14),transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(212,175,55,.07),transparent 55%);background-attachment:fixed}
.shell{width:100%;max-width:440px;min-height:572px;margin:auto;background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--border);border-radius:20px;padding:36px 26px 26px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:0 0 0 1px rgba(212,175,55,.07),0 25px 60px -12px rgba(0,0,0,.75),inset 0 1px 0 rgba(212,175,55,.06)}
.shell::before,.shell::after{position:absolute;color:var(--gold-deep);font-size:12px;line-height:1}.shell::before{content:"✦";top:10px;left:14px}.shell::after{content:"✦";bottom:10px;right:14px}
.seal{text-align:center;font-size:42px;line-height:1;margin-bottom:12px}
h1{font-family:var(--serif);color:var(--gold-brite);text-align:center;font-size:38px;font-weight:700;letter-spacing:.22em;text-indent:.22em;text-shadow:0 0 40px rgba(212,175,55,.35);margin-bottom:10px}
.founder{text-align:center;color:var(--gold);font-family:var(--serif);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.founder::before,.foundry::after{content:"—";color:var(--gold-deep);margin:0 8px}
.subtitle{text-align:center;color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:5px;margin-bottom:26px}
.gate{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.gate a{display:block;text-align:center;text-decoration:none;background:linear-gradient(180deg,var(--gold-brite),var(--gold-deep));color:var(--bg);font-family:var(--serif);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:10px;padding:16px;box-shadow:0 4px 18px rgba(212,175,55,.22);transition:all .2s ease}
.gate a:hover{filter:brightness(1.08);transform:translateY(-1px)}
.gate a.alt{background:linear-gradient(180deg,#2a3554,#1a2136);color:var(--gold-brite);border:1px solid rgba(212,175,55,.35);box-shadow:0 4px 18px rgba(212,175,55,.08)}
.gate a.alt:hover{filter:brightness(1.15)}
.hint{text-align:center;color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;line-height:1.8}
.foot{text-align:center;color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:1px;line-height:1.8;margin-top:18px}
</style>
</head>
<body>
<div class="shell">
  <div>
    <div class="seal">✦</div>
    <h1>AETHERION</h1>
    <div class="founder">Pio Esposito — Founder &amp; Curator</div>
    <div class="subtitle">Research Archive · Volume I</div>
    <div class="gate">
      <a href="en/">🇬🇧 &nbsp;Enter the Archive — English</a>
      <a class="alt" href="it/">🇮🇹 &nbsp;Entra nell'Archivio — Italiano</a>
    </div>
    <div class="hint">Choose your language · Scegli la lingua</div>
  </div>
  <div class="foot">— Pio Esposito · All Rights Reserved © 2026 —<br>Interactive fiction · For entertainment only</div>
</div>
</body>
</html>
